<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f766e">
<title>Pickleball Club</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14201b;--muted:#5f7068;--line:#dde5e1;--pri:#0f766e;--pri-ink:#fff;--acc:#c6f135;--a:#2563eb;--b:#ea580c;--danger:#dc2626;--sel:#ecfccb;--soft:#eef3f1}
@media (prefers-color-scheme:dark){:root{--bg:#0d1412;--card:#16201d;--ink:#e6eeea;--muted:#91a29a;--line:#293732;--pri:#14b8a6;--pri-ink:#04201c;--sel:#24371b;--soft:#1d2a26}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
h2{font-size:22px;margin:4px 0 8px}h3{font-size:16px;margin:18px 0 8px}
.top{position:sticky;top:0;z-index:5;background:var(--pri);color:var(--pri-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;margin:0;letter-spacing:.3px}
.logo{width:26px;height:26px;border-radius:50%;background:var(--acc);display:inline-grid;place-items:center;color:#14201b;font-weight:900;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.tabs button span{font-size:21px;line-height:1.1}
.tabs button.on{color:var(--pri);font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:7px 10px;font-size:14px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row.end{justify-content:flex-end;margin-top:18px}
.grow{flex:1}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card.click{cursor:pointer}
.tag{font-size:12px;background:var(--soft);border-radius:20px;padding:3px 9px;color:var(--muted);margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:40px 10px;border:2px dashed var(--line);border-radius:14px;margin-top:10px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:70px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px}
label.chk input{width:auto;margin:0}
input.inl{display:inline-block;width:70px;margin:0 4px;padding:6px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.search{margin-bottom:6px}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;background:#888;vertical-align:middle}
.av.lg{width:72px;height:72px;font-size:24px}
.av.xl{width:110px;height:110px;font-size:14px}
.av.ph{background:var(--soft);color:var(--muted);font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:inherit;color:var(--ink);cursor:pointer}
.photoedit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photoedit .btns{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:30px;padding:4px 12px 4px 4px;font:inherit;font-size:14px;cursor:pointer}
.chip .av{width:28px;height:28px;font-size:11px}
.chip.on{background:var(--sel);border-color:var(--pri);font-weight:600}
.chip.sel{outline:3px solid var(--acc);background:var(--sel)}
.teams{display:flex;flex-direction:column;gap:6px}
.team{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:6px 8px}
.team>b{width:22px;color:var(--muted)}
.hint{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:inherit;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px #0002}
.round{margin:18px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.round b{font-size:16px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.game{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.game.done{opacity:.85}
.game.live{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.gtop{display:flex;justify-content:space-between;margin-bottom:6px}
.court{font-size:12px;font-weight:700;background:var(--pri);color:var(--pri-ink);border-radius:6px;padding:2px 8px}
.gside{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:10px}
.gside.win{background:var(--sel)}
.gside .avs{display:flex}
.gside .avs .av+.av{margin-left:-10px;box-shadow:0 0 0 2px var(--card)}
.gn{flex:1;font-size:14px}
.gs{font-size:24px;font-weight:800;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.vs{font-size:11px;color:var(--muted);padding-left:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:center}
th:nth-child(2),td:nth-child(2){text-align:left}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1/1;min-height:42px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.cal button.today{border-color:var(--pri);font-weight:800}
.cal button.sel{background:var(--pri);color:var(--pri-ink)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--b)}
.dots i.ev{background:var(--a)}
.cal button.sel .dots i{background:var(--pri-ink)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--b);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.item.ev{border-left-color:var(--a)}
.item .t{font-weight:700;font-variant-numeric:tabular-nums;min-width:96px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.hidden{display:none!important}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14201bee;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
/* ---------- Scorer ---------- */
.scorer{position:fixed;inset:0;z-index:20;background:#0a1411;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none}
.sbar{display:flex;align-items:center;gap:6px;padding:8px}
.call{flex:1;text-align:center;font-size:clamp(24px,6vmin,46px);font-weight:900;letter-spacing:3px;font-variant-numeric:tabular-nums}
.call small{display:block;font-size:11px;letter-spacing:1px;font-weight:500;opacity:.6}
.sbtn{background:#ffffff1c;color:#fff;border:0;border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer}
.sbtn:disabled{opacity:.35}
.banner{margin:0 8px 8px;background:var(--acc);color:#14201b;border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:700}
.banner .sbtn{background:#14201b;color:#fff}
.courtwrap{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 8px;min-height:0}
@media (orientation:portrait){.courtwrap{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
.half{border-radius:16px;display:flex;flex-direction:column;padding:10px;gap:8px;min-height:0;background:#11241f;border:3px solid transparent}
.half.t0{border-color:var(--a)}.half.t1{border-color:var(--b)}
.half.serving{background:#16443a}
.hhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tname{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;font-weight:800;border-radius:20px;padding:4px 10px;background:#ffffff22;letter-spacing:.5px}
.serving .badge{background:var(--acc);color:#14201b}
.rally{flex:1;border:0;border-radius:12px;background:#ffffff10;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80px;cursor:pointer;font:inherit}
.rally:active{background:#ffffff33}
.big{font-size:clamp(60px,17vmin,190px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.rally .hint2{font-size:13px;opacity:.6;margin-top:4px}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.spots.one{grid-template-columns:1fr}
.spot{background:#ffffff12;border-radius:10px;padding:6px 8px;display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.spot small{font-size:10px;letter-spacing:1px;opacity:.7;writing-mode:vertical-rl;transform:rotate(180deg)}
.spot .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spot em{font-style:normal;font-size:11px;font-weight:800;display:block}
.spot.srv{background:var(--acc);color:#14201b}
.spot.rcv{outline:2px dashed #ffffffaa}
.hfoot{display:flex;gap:6px;flex-wrap:wrap}
.hfoot .sbtn{flex:1;font-size:14px;padding:9px 8px}
.winbox,.tbox{position:fixed;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;z-index:25}
.winbox h2{font-size:30px;margin:0}
.winbox .fs{font-size:64px;font-weight:900}
#timer{position:fixed;inset:0;z-index:35}
.tbox{z-index:35;background:#0a1411f2;color:#fff}
.tnum{font-size:min(30vw,180px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.tbox.over .tnum{color:var(--acc)}
.rules li{margin:6px 0}
.pill{margin-left:auto;border:0;border-radius:20px;padding:5px 11px;font:inherit;font-size:12px;font-weight:600;background:#ffffff2e;color:inherit;cursor:pointer}
.pill.err{background:#dc2626;color:#fff}
pre.code{background:var(--soft);padding:10px;border-radius:10px;overflow:auto;font-size:12px;margin:8px 0}
details summary{cursor:pointer;color:var(--pri);font-weight:600;margin:10px 0}
ol.small li{margin:6px 0}

/* ---------- Court view ---------- */
.sbtn.on{background:var(--acc);color:#14201b}
.banner.info{background:#ffffff1c;color:#fff;font-weight:500}
.arena{flex:1;display:flex;gap:8px;padding:0 8px 8px;min-height:0}
.arena.port{flex-direction:column}
.panel{flex:0 0 clamp(150px,21%,260px);display:flex;flex-direction:column;gap:8px;border-radius:16px;padding:10px;background:#11241f;border:3px solid transparent;min-width:0;transition:background .2s}
.panel.p0{border-color:var(--a)}.panel.p1{border-color:var(--b)}
.panel.serving{background:var(--acc);color:#14201b}
.panel.serving .badge{background:#14201b;color:var(--acc)}
.panel.serving .rally{background:#14201b14;color:#14201b}
.panel.serving .sbtn{background:#14201b1f;color:#14201b}
.pteam{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;min-width:0}
.pteam .av{width:30px;height:30px;font-size:11px}
.pteam span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:4px}
.panel .badge{align-self:flex-start}
.pbtns{display:flex;flex-direction:column;gap:6px}
.pbtns .sbtn{font-size:13px;padding:9px 8px}
.arena.port .panel{flex:0 0 auto;display:grid;grid-template-columns:1fr minmax(110px,38%);grid-template-areas:"team score" "badge score" "btns score";gap:6px 10px;align-items:center;padding:8px 10px}
.arena.port .pteam{grid-area:team}.arena.port .badge{grid-area:badge}.arena.port .rally{grid-area:score;min-height:96px}.arena.port .pbtns{grid-area:btns;flex-direction:row;flex-wrap:wrap}
.arena.port .pbtns .sbtn{flex:1}
.arena.port .big{font-size:clamp(48px,13vmin,96px)}
.pcbox{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
.pc{position:relative;background:#2f7f52;outline:3px solid #fff;box-shadow:0 0 0 14px #1d5236,0 8px 30px #000a;border-radius:2px}
.pc.land{aspect-ratio:44/20;width:min(calc(100cqw - 32px),calc((100cqh - 32px) * 2.2))}
.pc.port{aspect-ratio:20/44;width:min(calc(100cqw - 32px),calc((100cqh - 32px) * 20 / 44))}
.zone{position:absolute;box-shadow:inset 0 0 0 1.5px #ffffffd9}
.kit{background:#3e9a67;display:flex;align-items:center;justify-content:center}
.kit span{font-size:10px;font-weight:800;letter-spacing:3px;color:#ffffff59}
.pc.land .kit span{writing-mode:vertical-rl}
.net{position:absolute;background:#e9eef0;border-radius:3px;box-shadow:0 0 8px #000a;z-index:1}
.sarrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.sarrow line{stroke:var(--acc);stroke-width:4;vector-effect:non-scaling-stroke;stroke-dasharray:2 10;stroke-linecap:round;animation:servedash .7s linear infinite}
@keyframes servedash{to{stroke-dashoffset:-12}}
.pl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:3;text-align:center;color:#fff;pointer-events:none;padding:2px}
.avw{position:relative}
.pl .av{width:clamp(34px,13cqmin,88px);height:clamp(34px,13cqmin,88px);font-size:clamp(12px,4cqmin,26px);box-shadow:0 0 0 3px #fff}
.pl.t0 .av{box-shadow:0 0 0 3px var(--a)}.pl.t1 .av{box-shadow:0 0 0 3px var(--b)}
.pl.srv .av{box-shadow:0 0 0 4px var(--acc),0 0 22px 4px var(--acc)}
.pl.rcv .av{outline:3px dashed #fff;outline-offset:4px}
.ball{position:absolute;right:-5px;bottom:-3px;width:clamp(12px,3.5cqmin,22px);height:clamp(12px,3.5cqmin,22px);border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px #14201b}
.pn{font-size:clamp(11px,3cqmin,17px);font-weight:700;background:#000000a0;padding:1px 7px;border-radius:6px;max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagS,.tagR{font-size:clamp(9px,2.2cqmin,12px);font-weight:900;letter-spacing:.5px;padding:1px 7px;border-radius:6px}
.tagS{background:var(--acc);color:#14201b}.tagR{background:#fff;color:#14201b}
.call small{text-transform:none;letter-spacing:.3px}
@media (max-width:640px){.sbar{flex-wrap:wrap}.call{order:-1;flex-basis:100%;font-size:38px}.sbar .sbtn{flex:1;padding:9px 6px;font-size:14px}}
</style>
</head>
<body>
<header class="top"><span class="logo">PB</span><h1>Pickleball Club</h1><button id="cloudPill" class="pill hidden" data-act="tab" data-v="settings"></button></header>
<main id="view"></main>
<nav class="tabs">
  <button data-act="tab" data-v="events"><span>📋</span>Events</button>
  <button data-act="tab" data-v="players"><span>👥</span>Players</button>
  <button data-act="tab" data-v="calendar"><span>📅</span>Calendar</button>
  <button data-act="tab" data-v="quick"><span>⚡</span>Quick game</button>
  <button data-act="tab" data-v="settings"><span>⚙️</span>More</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="scorer" class="scorer hidden"></div>
<div id="timer" class="hidden"></div>
<div id="toast"></div>

<script>
/* ================= Storage & helpers ================= */
const KEY='pickleball_club_v1';
const blank=()=>({players:[],events:[],bookings:[],quick:null,quickHist:[]});
let S=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.players))return Object.assign(blank(),d);}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Storage is full — export a backup and remove some photos.');}if(typeof cloudQueue==='function')cloudQueue();}
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const P=id=>S.players.find(p=>p.id===id);
const getEv=id=>S.events.find(e=>e.id===id);
const gen=id=>(P(id)||{}).gender||'';
function pname(id){const p=P(id);if(p)return p.name;if(id&&id.startsWith('guest:'))return id.slice(6);return '(removed)';}
function avatar(id,cls=''){const p=P(id),n=pname(id);
  if(p&&p.photo)return `<img class="av ${cls}" src="${p.photo}" alt="">`;
  const ini=n.replace(/[()]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()||'?';
  let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;
  return `<span class="av ${cls}" style="background:hsl(${h} 50% 42%)">${esc(ini)}</span>`;}
const teamLabel=ids=>ids.map(pname).join(' & ');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const toMin=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return h*60+m;};
const addMin=(t,m)=>{const x=toMin(t)+m;return `${pad(Math.floor(x/60)%24)}:${pad(x%60)}`;};
const fmtDate=iso=>new Date(iso+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtShort=iso=>new Date(iso+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'});
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');$('#sheet').innerHTML='';}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

const FMT={singles:'Singles',fixed:'Fixed partners',mixed:'Mixed doubles',rotating:'Mixed partners (rotating)'};
const FMTHELP={singles:'One player per side.',fixed:'Pairs stay together for the whole event. Auto-pair, then tap two players to swap.',mixed:'Fixed teams of 1 male + 1 female. Auto-pair, then tap two players to swap.',rotating:'Partners change every game so everyone mixes. Each player gets an equal number of games.'};
const GEN={M:'Male',F:'Female','':'—'};

/* ================= Router ================= */
const ACT={};
let tab='events',openEventId=null,evTab='schedule';
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  const v=$('#view');
  if(tab==='players')v.innerHTML=viewPlayers();
  else if(tab==='events')v.innerHTML=openEventId?viewEvent(openEventId):viewEvents();
  else if(tab==='calendar')v.innerHTML=viewCalendar();
  else if(tab==='quick')v.innerHTML=viewQuick();
  else v.innerHTML=viewSettings();}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t.dataset,t,e);}});
ACT.tab=d=>{tab=d.v;if(d.v!=='events')openEventId=null;render();window.scrollTo(0,0);};
ACT.closeModal=closeModal;

ACT.playerSave=d=>{const name=$('#f_name').value.trim();if(!name)return toast('Please enter a name');
  const data={name,gender:$('#f_gender').value,level:$('#f_level').value.trim(),contact:$('#f_contact').value.trim(),notes:$('#f_notes').value.trim(),photo:editPhoto};

ACT.playerDelete=d=>{const used=S.events.filter(e=>e.playerIds.includes(d.id)).length;
  if(!confirm(`Delete ${pname(d.id)}?`+(used?`\n\nThey appear in ${used} event(s). Those games will show "(removed)" — you can substitute another player via ✎ Edit on each game.`:'')))return;
  S.players=S.players.filter(p=>p.id!==d.id);save();closeModal();render();toast('Player deleted');};
function resizeImage(file,max=256){return new Promise((res,rej)=>{const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=Math.min(max,s);
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82));};img.onerror=rej;img.src=fr.result;};
  fr.onerror=rej;fr.readAsDataURL(file);});}

/* ================= Game generators ================= */
// Round robin (circle method) -> flat list of matches [unitA, unitB]
function genRR(units){const arr=units.slice();if(arr.length%2)arr.push(null);const n=arr.length,out=[];
  for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b)out.push([a,b]);}arr.splice(1,0,arr.pop());}return out;}
// Pack matches into rounds limited by courts, no player twice in a round
function pack(matches,courts){const rem=matches.slice(),rounds=[];
  while(rem.length){const used=new Set(),round=[];
    for(let i=0;i<rem.length&&round.length<courts;){const ids=rem[i].flat();if(ids.some(x=>used.has(x))){i++;continue;}ids.forEach(x=>used.add(x));round.push(rem.splice(i,1)[0]);}
    rounds.push(round);}return rounds;}
// Equal number of games per unit (team or singles player)
function genCount(units,G,courts){const n=units.length,cnt=Array(n).fill(0),met={},k=(a,b)=>a<b?a+'-'+b:b+'-'+a,rounds=[];
  for(let guard=0;guard<1000;guard++){const avail=shuffle([...Array(n).keys()].filter(i=>cnt[i]<G)).sort((a,b)=>cnt[a]-cnt[b]);
    if(avail.length<2)break;const pool=avail.slice(0,Math.min(courts*2,avail.length-avail.length%2)),round=[];
    while(pool.length>=2){const a=pool.shift();let bi=0,bv=1e9;pool.forEach((b,j)=>{const v=met[k(a,b)]||0;if(v<bv){bv=v;bi=j;}});
      const b=pool.splice(bi,1)[0];met[k(a,b)]=(met[k(a,b)]||0)+1;cnt[a]++;cnt[b]++;round.push([units[a],units[b]]);}
    rounds.push(round);}return rounds;}
// Rotating partners, equal games, minimise repeat partners/opponents
function genRotating(ids,G,courts,mixed){const cnt={},part={},opp={},k=(a,b)=>a<b?a+'|'+b:b+'|'+a,rounds=[];ids.forEach(i=>cnt[i]=0);
  const low=arr=>shuffle(arr.filter(i=>cnt[i]<G)).sort((a,b)=>cnt[a]-cnt[b]);
  const cost=gs=>gs.reduce((s,[A,B])=>s+(part[k(A[0],A[1])]||0)*10+(part[k(B[0],B[1])]||0)*10+A.reduce((x,a)=>x+B.reduce((y,b)=>y+(opp[k(a,b)]||0),0),0)*2,0);
  for(let guard=0;guard<1000;guard++){let best=null,bc=1e9;
    if(mixed){const M=low(ids.filter(i=>gen(i)==='M')),F=low(ids.filter(i=>gen(i)==='F'));const n=Math.min(courts,Math.floor(M.length/2),Math.floor(F.length/2));if(!n)break;
      const m=M.slice(0,2*n),f=F.slice(0,2*n);
      for(let t=0;t<300;t++){shuffle(m);shuffle(f);const gs=[];for(let j=0;j<n;j++)gs.push([[m[2*j],f[2*j]],[m[2*j+1],f[2*j+1]]]);const c=cost(gs);if(c<bc){bc=c;best=gs.map(g=>g.map(t=>t.slice()));}if(!c)break;}}
    else{const A=low(ids);const n=Math.min(courts,Math.floor(A.length/4));if(!n)break;const sel=A.slice(0,4*n);
      for(let t=0;t<300;t++){shuffle(sel);const gs=[];for(let j=0;j<n;j++)gs.push([[sel[4*j],sel[4*j+1]],[sel[4*j+2],sel[4*j+3]]]);const c=cost(gs);if(c<bc){bc=c;best=gs.map(g=>g.map(t=>t.slice()));}if(!c)break;}}
    best.forEach(([A,B])=>{[...A,...B].forEach(i=>cnt[i]++);part[k(A[0],A[1])]=(part[k(A[0],A[1])]||0)+1;part[k(B[0],B[1])]=(part[k(B[0],B[1])]||0)+1;A.forEach(a=>B.forEach(b=>opp[k(a,b)]=(opp[k(a,b)]||0)+1));});
    rounds.push(best);}return rounds;}

/* ================= Events ================= */
function eventEnd(e){const nR=e.games.length?Math.max(...e.games.map(g=>g.round))+1:0;return addMin(e.startTime,nR*e.gameMinutes);}
function viewEvents(){const ev=[...S.events].sort((a,b)=>(b.date+b.startTime).localeCompare(a.date+a.startTime));
  return `<div class="bar"><h2>Events</h2><span class="grow"></span><button class="btn pri" data-act="eventNew">+ New event</button></div>
  ${ev.map(e=>{const done=e.games.filter(g=>g.status==='done').length;return `<div class="card click" data-act="eventOpen" data-id="${e.id}">
   <div class="row" style="margin:0"><b>${esc(e.name)}</b><span class="tag">${FMT[e.format]}</span></div>
   <div class="muted small">${fmtDate(e.date)} · ${e.startTime}–${eventEnd(e)} · ${e.courts} court(s) · ${done}/${e.games.length} games played</div></div>`;}).join('')
   ||'<div class="empty">No events yet.<br>Add players first, then tap <b>+ New event</b> to generate games.</div>'}`;}
ACT.eventOpen=d=>{openEventId=d.id;evTab='schedule';render();window.scrollTo(0,0);};
ACT.eventBack=()=>{openEventId=null;render();};
ACT.evTab=d=>{evTab=d.v;render();};

let draft=null;
ACT.eventNew=d=>{if(S.players.length<2){toast('Add at least 2 players first');tab='players';render();return;}
  draft={name:'',format:'rotating',genderRule:false,date:d.date||todayISO(),startTime:'08:00',gameMinutes:15,courts:2,gameTo:11,mode:'count',perPlayer:4,playerIds:[],teams:[],unpaired:[],sel:null};renderDraft();};
function renderDraft(){const D=draft,st=$('#sheet').scrollTop,teamFmt=D.format==='fixed'||D.format==='mixed';
  const sorted=[...S.players].sort((a,b)=>a.name.localeCompare(b.name)),rot=D.format==='rotating';
  openModal(`<h2>New event</h2>
  <label>Event name<input data-draft="name" value="${esc(D.name)}" placeholder="e.g. Saturday social"></label>
  <label>Format<select data-draft="format">${Object.entries(FMT).map(([k,v])=>`<option value="${k}" ${k===D.format?'selected':''}>${v}</option>`).join('')}</select></label>
  <p class="muted small">${FMTHELP[D.format]}</p>
  ${rot?`<label class="chk"><input type="checkbox" data-draft="genderRule" ${D.genderRule?'checked':''}> Every team must be 1 male + 1 female</label>`:''}
  <div class="grid2">
   <label>Date<input type="date" data-draft="date" value="${D.date}"></label>
   <label>Start time<input type="time" data-draft="startTime" value="${D.startTime}"></label>
   <label>Minutes per game<input type="number" min="5" max="120" data-draft="gameMinutes" value="${D.gameMinutes}"></label>
   <label>Courts available<input type="number" min="1" max="40" data-draft="courts" value="${D.courts}"></label>
   <label>Game to<select data-draft="gameTo">${[11,15,21].map(n=>`<option ${n==D.gameTo?'selected':''}>${n}</option>`).join('')}</select></label>
  </div>
  <h3>Players <span class="muted small">(${D.playerIds.length} selected)</span></h3>
  <div class="row"><button class="btn sm" data-act="draftAll">Select all</button><button class="btn sm" data-act="draftNone">Clear</button></div>
  <div class="chips">${sorted.map(p=>`<button class="chip ${D.playerIds.includes(p.id)?'on':''}" data-act="draftToggle" data-id="${p.id}">${avatar(p.id)}${esc(p.name)}${p.gender?` <small class="muted">${p.gender}</small>`:''}</button>`).join('')}</div>
  ${teamFmt?teamsHTML():''}
  <h3>Schedule</h3>
  ${!rot?`<label class="chk"><input type="radio" name="mode" data-draft="mode" value="rr" ${D.mode==='rr'?'checked':''}> Round robin — every ${D.format==='singles'?'player':'team'} plays every other once</label>`:''}
  <label class="chk"><input type="radio" name="mode" data-draft="mode" value="count" ${D.mode==='count'||rot?'checked':''}> Equal games: <input type="number" class="inl" min="1" max="50" data-draft="perPlayer" value="${D.perPlayer}"> games each</label>
  <p class="hint" id="dhint">${scheduleHint()}</p>
  <div class="row end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="eventCreate">Generate games</button></div>`);
  $('#sheet').scrollTop=st;}
const pidBtn=id=>`<button class="chip ${draft.sel===id?'sel':''}" data-act="teamTap" data-id="${id}">${avatar(id)}${esc(pname(id))}</button>`;
function teamsHTML(){const D=draft;return `<h3>Teams</h3>
  <div class="row"><button class="btn sm" data-act="draftPair">🔀 Auto-pair${D.format==='mixed'?' (M + F)':''}</button><span class="muted small">Tap two players to swap them.</span></div>
  <div class="teams">${D.teams.map((t,i)=>`<div class="team"><b>${i+1}</b>${t.map(pidBtn).join('<span class="muted">&</span>')}</div>`).join('')||'<p class="muted small">Select players above.</p>'}</div>
  ${D.unpaired.length?`<p class="muted small">Not paired (will sit out):</p><div class="chips">${D.unpaired.map(pidBtn).join('')}</div>`:''}`;}
function autoPair(){const D=draft,ids=shuffle(D.playerIds.slice());D.teams=[];D.unpaired=[];D.sel=null;
  if(D.format==='mixed'){const M=ids.filter(i=>gen(i)==='M'),F=ids.filter(i=>gen(i)==='F'),O=ids.filter(i=>!['M','F'].includes(gen(i))),n=Math.min(M.length,F.length);
    for(let i=0;i<n;i++)D.teams.push([M[i],F[i]]);D.unpaired=[...M.slice(n),...F.slice(n),...O];}
  else{for(let i=0;i+1<ids.length;i+=2)D.teams.push([ids[i],ids[i+1]]);if(ids.length%2)D.unpaired=[ids[ids.length-1]];}}
function scheduleHint(){const D=draft,G=+D.perPlayer||1;
  if(D.format==='rotating'){const n=D.playerIds.length;if(n<4)return 'Select at least 4 players.';
    let msg=`${n} players × ${G} games each = ${Math.floor(n*G/4)} games in total.`;
    if((n*G)%4){const ok=[];for(let g=1;g<=24&&ok.length<4;g++)if((n*g)%4===0)ok.push(g);msg=`⚠️ ${n} players × ${G} games isn't divisible by 4, so a few players would get one game fewer. For perfectly equal games choose: ${ok.join(', ')} games each.`;}
    if(D.genderRule){const M=D.playerIds.filter(i=>gen(i)==='M').length,F=D.playerIds.filter(i=>gen(i)==='F').length;if(M!==F)msg+=` ⚠️ ${M} male vs ${F} female selected — with 1M+1F teams the larger group will play fewer games.`;}
    return msg;}
  const units=D.format==='singles'?D.playerIds.length:D.teams.length,lab=D.format==='singles'?'players':'teams';
  if(units<2)return `Need at least 2 ${lab}.`;
  if(D.mode==='rr')return `${units} ${lab} → ${units*(units-1)/2} games, ${units-1} games each.`;
  if((units*G)%2)return `⚠️ ${units} ${lab} × ${G} games is odd, so one ${lab.slice(0,-1)} would get one game fewer. Choose an even number of games for equal play.`;
  return `${units} ${lab} × ${G} games each = ${units*G/2} games in total.`;}
ACT.draftToggle=d=>{const a=draft.playerIds,i=a.indexOf(d.id);i>=0?a.splice(i,1):a.push(d.id);if(draft.format==='fixed'||draft.format==='mixed')autoPair();renderDraft();};
ACT.draftAll=()=>{draft.playerIds=S.players.map(p=>p.id);if(draft.format!=='singles'&&draft.format!=='rotating')autoPair();renderDraft();};
ACT.draftNone=()=>{draft.playerIds=[];draft.teams=[];draft.unpaired=[];renderDraft();};
ACT.draftPair=()=>{autoPair();renderDraft();};
function locate(pid){for(const t of draft.teams){const k=t.indexOf(pid);if(k>=0)return[t,k];}const k=draft.unpaired.indexOf(pid);return k>=0?[draft.unpaired,k]:null;}
ACT.teamTap=d=>{if(!draft.sel)draft.sel=d.id;else if(draft.sel===d.id)draft.sel=null;else{const a=locate(draft.sel),b=locate(d.id);if(a&&b){const t=a[0][a[1]];a[0][a[1]]=b[0][b[1]];b[0][b[1]]=t;}draft.sel=null;}renderDraft();};
ACT.eventCreate=()=>{const D=draft,courts=Math.max(1,+D.courts||1),G=Math.max(1,+D.perPlayer||1);let rounds;
  if(D.format==='rotating'){if(D.playerIds.length<4)return toast('Select at least 4 players');rounds=genRotating(D.playerIds,G,courts,D.genderRule);}
  else{const units=D.format==='singles'?D.playerIds.map(i=>[i]):D.teams.filter(t=>t.length===2).map(t=>t.slice());
    if(units.length<2)return toast('Need at least 2 '+(D.format==='singles'?'players':'teams'));
    rounds=D.mode==='rr'?pack(genRR(units),courts):genCount(units,G,courts);}
  rounds=rounds.filter(r=>r.length);if(!rounds.length)return toast('Could not generate games — check the players selected');
  const ev={id:uid(),name:D.name.trim()||`${FMT[D.format]} · ${fmtShort(D.date)}`,format:D.format,date:D.date,startTime:D.startTime||'08:00',gameMinutes:+D.gameMinutes||15,courts,gameTo:+D.gameTo||11,winBy:2,playerIds:D.playerIds.slice(),teams:D.teams,notes:'',games:[]};
  rounds.forEach((r,ri)=>r.forEach((m,ci)=>ev.games.push({id:uid(),round:ri,court:ci+1,sides:[m[0].slice(),m[1].slice()],status:'pending',score:[0,0],live:null})));
  S.events.push(ev);save();closeModal();tab='events';openEventId=ev.id;evTab='schedule';render();toast(`${ev.games.length} games generated`);};

function viewEvent(id){const e=getEv(id);if(!e){openEventId=null;return viewEvents();}
  const cnt={};e.games.forEach(g=>g.sides.flat().forEach(i=>cnt[i]=(cnt[i]||0)+1));const vals=Object.values(cnt),lo=Math.min(...vals),hi=Math.max(...vals);
  return `<div class="bar"><button class="btn" data-act="eventBack">‹ Events</button><span class="grow"></span><button class="btn" data-act="eventEdit">✎ Edit</button><button class="btn danger" data-act="eventDelete">Delete</button></div>
  <h2>${esc(e.name)}</h2>
  <p class="muted" style="margin:0">${FMT[e.format]} · ${fmtDate(e.date)} · ${e.startTime}–${eventEnd(e)} · ${e.courts} court(s) · game to ${e.gameTo}</p>
  <p class="muted small">${vals.length?(lo===hi?`Every player plays ${lo} games`:`${lo}–${hi} games per player`):''}${e.notes?' · '+esc(e.notes):''}</p>
  <div class="seg"><button class="${evTab==='schedule'?'on':''}" data-act="evTab" data-v="schedule">Schedule</button><button class="${evTab==='standings'?'on':''}" data-act="evTab" data-v="standings">Standings</button></div>
  ${evTab==='schedule'?schedHTML(e):standHTML(e)}`;}
function schedHTML(e){const nR=Math.max(...e.games.map(g=>g.round))+1;let h='';
  for(let r=0;r<nR;r++){const gs=e.games.filter(g=>g.round===r),inR=new Set(gs.flatMap(g=>g.sides.flat())),out=e.playerIds.filter(i=>!inR.has(i)&&P(i));
    h+=`<div class="round"><b>Round ${r+1}</b><span class="muted">${addMin(e.startTime,r*e.gameMinutes)}–${addMin(e.startTime,(r+1)*e.gameMinutes)}</span>${out.length?`<span class="muted small">Sitting out: ${out.map(pname).map(esc).join(', ')}</span>`:''}</div>
    <div class="ggrid">${gs.map(g=>gameCard(g)).join('')}</div>`;}
  return h;}
function gameCard(g){const done=g.status==='done',live=g.status==='live',sc=live&&g.live?g.live.score:g.score;
  const w=done?(sc[0]>sc[1]?0:sc[1]>sc[0]?1:-1):-1;
  return `<div class="game ${g.status}"><div class="gtop"><span class="court">Court ${g.court}</span><span class="muted small">${done?'Final':live?'● In progress':''}</span></div>
  ${[0,1].map(t=>`<div class="gside ${w===t?'win':''}"><div class="avs">${g.sides[t].map(id=>avatar(id)).join('')}</div><div class="gn">${g.sides[t].map(id=>esc(pname(id))).join('<br>')}</div><div class="gs">${done||live?sc[t]:''}</div></div>`).join('<div class="vs">vs</div>')}
  <div class="row" style="margin-bottom:0"><button class="btn pri sm" data-act="gameScore" data-g="${g.id}">${live?'▶ Resume':done?'👁 View':'▶ Score'}</button><button class="btn sm" data-act="gameEdit" data-g="${g.id}">✎ Edit / substitute</button></div></div>`;}
function standHTML(e){const rows={};
  e.games.filter(g=>g.status==='done').forEach(g=>[0,1].forEach(t=>{const o=1-t;(e.format==='rotating'?g.sides[t].map(i=>[i]):[g.sides[t]]).forEach(ids=>{
    const k=ids.join('+'),r=rows[k]||(rows[k]={ids,w:0,l:0,pf:0,pa:0,gp:0});r.gp++;r.pf+=g.score[t];r.pa+=g.score[o];if(g.score[t]>g.score[o])r.w++;else if(g.score[t]<g.score[o])r.l++;});}));
  const list=Object.values(rows).sort((a,b)=>b.w-a.w||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf);
  if(!list.length)return '<div class="empty">Standings appear once games are finished.</div>';
  return `<table><tr><th>#</th><th>${e.format==='rotating'||e.format==='singles'?'Player':'Team'}</th><th>P</th><th>W</th><th>L</th><th>+/−</th></tr>
  ${list.map((r,i)=>`<tr><td>${i+1}</td><td>${r.ids.map(id=>avatar(id)).join('')} ${esc(teamLabel(r.ids))}</td><td>${r.gp}</td><td><b>${r.w}</b></td><td>${r.l}</td><td>${r.pf-r.pa>0?'+':''}${r.pf-r.pa}</td></tr>`).join('')}</table>
  <p class="muted small">Ranked by wins, then point difference, then points scored.</p>`;}
ACT.eventEdit=()=>{const e=getEv(openEventId);openModal(`<h2>Edit event</h2>
  <label>Name<input id="e_name" value="${esc(e.name)}"></label>

/* ================= Scorer (traditional side-out scoring) ================= */
let SC=null,WL=null;
async function wake(on){try{if(on&&'wakeLock' in navigator)WL=await navigator.wakeLock.request('screen');else if(!on&&WL){await WL.release();WL=null;}}catch(e){}}
function getGame(ctx){if(ctx.quick)return S.quick;const e=getEv(ctx.e);return e&&e.games.find(g=>g.id===ctx.g);}
function newLive(g){const dbl=g.sides[0].length>1;return{score:[0,0],serving:0,serverNum:dbl?2:0,server:g.sides[0][0],pos:[g.sides[0].slice(),g.sides[1].slice()],to:[0,0],med:[0,0],flipped:false,midDone:false,midPrompt:false,winner:null,hist:[]};}
function openScorer(ctx){const g=getGame(ctx);if(!g)return;if(!g.live)g.live=newLive(g);SC={ctx};$('#scorer').classList.remove('hidden');document.body.classList.add('noscroll');wake(true);drawScorer();}
function closeScorer(){$('#scorer').classList.add('hidden');document.body.classList.remove('noscroll');SC=null;wake(false);render();}
function snap(L){const c=JSON.parse(JSON.stringify(L));delete c.hist;L.hist.push(JSON.stringify(c));if(L.hist.length>80)L.hist.shift();}
const midOf=to=>Math.ceil(to/2); // 11→6, 15→8, 21→11
const maxTO=to=>to>=21?3:2;
function rally(t){const g=getGame(SC.ctx),L=g.live;if(L.winner!=null)return;snap(L);const o=1-t,dbl=L.pos[0].length>1;
  if(t===L.serving){L.score[t]++;if(dbl)L.pos[t].reverse(); // server switches sides with partner
    if(!L.midDone&&L.score[t]===midOf(g.gameTo)){L.midDone=true;L.midPrompt=true;}
    if(L.score[t]>=g.gameTo&&L.score[t]-L.score[o]>=(g.winBy||2))L.winner=t;}
  else{if(dbl&&L.serverNum===1){L.serverNum=2;L.server=L.pos[L.serving].find(p=>p!==L.server);} // second server
    else{L.serving=t;L.serverNum=dbl?1:0;L.server=L.pos[t][0];}} // side out: right-court player serves
  if(g.status!=='done')g.status='live';save();if(navigator.vibrate)navigator.vibrate(30);drawScorer();}
const KIT=15/44*100; // service area = 15 ft of each 22 ft half; kitchen = 7 ft
let followServer=localStorage.getItem('pb_follow')==='1';
const zoneRect=(end,side)=>{const top=end===0?side==='L':side==='R';return{x:end===0?0:100-KIT,y:top?0:50,w:KIT,h:50};};
const TR=(r,p)=>p?{x:100-r.y-r.h,y:r.x,w:r.h,h:r.w}:r; // landscape → portrait
const sty=r=>`left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%`;
const ctr=r=>[r.x+r.w/2,r.y+r.h/2];
function drawScorer(){if(!SC)return;const g=getGame(SC.ctx);if(!g){closeScorer();return;}
  const L=g.live,dbl=L.pos[0].length>1,s=L.serving,o=1-s,fresh=!L.hist.length,mt=maxTO(g.gameTo);
  const portrait=matchMedia('(orientation: portrait)').matches;
  // doubles: server stands where they are (right after a side out, switching after each point); singles: right when own score is even
  const rs=dbl?(L.server===L.pos[s][0]?'R':'L'):(L.score[s]%2===0?'R':'L'),serverRight=rs==='R';
  const call=dbl?`${L.score[s]}-${L.score[o]}-${L.serverNum}`:`${L.score[s]}-${L.score[o]}`;
  const order=followServer?[o,s]:(L.flipped?[1,0]:[0,1]),endOf=t=>order.indexOf(t);
  // where every player is standing
  const spots=[];[0,1].forEach(t=>{if(dbl)spots.push({pid:L.pos[t][0],t,side:'R'},{pid:L.pos[t][1],t,side:'L'});else spots.push({pid:L.pos[t][0],t,side:rs});});
  const srv=spots.find(p=>p.t===s&&p.pid===L.server),rcv=spots.find(p=>p.t===o&&p.side===rs);
  let court='';
  [0,1].forEach(end=>['R','L'].forEach(side=>court+=`<div class="zone" style="${sty(TR(zoneRect(end,side),portrait))}"></div>`));
  court+=`<div class="zone kit" style="${sty(TR({x:KIT,y:0,w:50-KIT,h:100},portrait))}"><span>KITCHEN</span></div><div class="zone kit" style="${sty(TR({x:50,y:0,w:50-KIT,h:100},portrait))}"><span>KITCHEN</span></div>`;
  court+=`<div class="net" style="${sty(TR({x:49.4,y:-5,w:1.2,h:110},portrait))}"></div>`;
  if(srv&&rcv){const A=ctr(TR(zoneRect(endOf(s),srv.side),portrait)),B=ctr(TR(zoneRect(endOf(o),rcv.side),portrait)),f=k=>[A[0]+(B[0]-A[0])*k,A[1]+(B[1]-A[1])*k],p=f(.24),q=f(.76);
    court+=`<svg class="sarrow" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"/></svg>`;}
  court+=spots.map(sp=>{const isS=srv&&sp===srv,isR=rcv&&sp===rcv;
    return `<div class="pl t${sp.t} ${isS?'srv':''} ${isR?'rcv':''}" style="${sty(TR(zoneRect(endOf(sp.t),sp.side),portrait))}">
      <div class="avw">${avatar(sp.pid)}${isS?'<i class="ball"></i>':''}</div><span class="pn">${esc(pname(sp.pid))}</span>
      ${isS?`<span class="tagS">SERVER${dbl?' '+L.serverNum:''}</span>`:isR?'<span class="tagR">RECEIVER</span>':''}</div>`;}).join('');
  const panel=t=>{const isS=t===s;return `<div class="panel p${t} ${isS?'serving':''}">
    <div class="pteam">${g.sides[t].map(id=>avatar(id)).join('')}<span>${esc(teamLabel(g.sides[t]))}</span></div>
    <span class="badge">${isS?(dbl?'SERVING · SERVER '+L.serverNum:'SERVING'):'RECEIVING'}</span>
    <button class="rally" data-act="rally" data-t="${t}"><span class="big">${L.score[t]}</span><span class="hint2">Tap if rally won</span></button>
    <div class="pbtns"><button class="sbtn" data-act="timeout" data-t="${t}" ${L.to[t]>=mt||L.winner!=null?'disabled':''}>⏱ Timeout · ${mt-L.to[t]} left</button>
    ${fresh?`<button class="sbtn" data-act="firstServe" data-t="${t}" ${isS?'disabled':''}>${isS?'Serves first ✓':'Serve first'}</button>${dbl?`<button class="sbtn" data-act="swapPos" data-t="${t}">⇅ Swap players</button>`:''}`:''}</div></div>`;};
  $('#scorer').innerHTML=`<div class="sbar"><button class="sbtn" data-act="scClose">✕</button><button class="sbtn" data-act="undo" ${fresh?'disabled':''}>↶ Undo</button>
    <div class="call">${call}<small>${esc(pname(L.server))} serves from the ${serverRight?'right':'left'} · to ${g.gameTo}</small></div>
    <button class="sbtn ${followServer?'on':''}" data-act="followServer" title="Keep the serving team on the same side">${followServer?'👁 Server view':'👁 Court view'}</button>
    <button class="sbtn" data-act="swapEnds" ${followServer?'disabled':''}>⇆ Ends</button><button class="sbtn" data-act="scMenu">⋯</button></div>
   ${L.midPrompt?`<div class="banner">🔄 Switch ends — a team reached ${midOf(g.gameTo)}.<span class="grow"></span><button class="sbtn" data-act="swapEnds">Swap ends now</button><button class="sbtn" data-act="dismissMid">Not now</button></div>`:''}
   ${fresh?`<div class="banner info">Pick who serves first and swap players into their starting boxes, then tap a score each rally. Doubles starts at 0-0-2.</div>`:''}
   <div class="arena ${portrait?'port':'land'}">${panel(order[0])}<div class="pcbox"><div class="pc ${portrait?'port':'land'}">${court}</div></div>${panel(order[1])}</div>
   ${L.winner!=null?`<div class="winbox"><div>🏆</div><h2>${esc(teamLabel(g.sides[L.winner]))} win!</h2><div class="fs">${L.score[L.winner]} – ${L.score[1-L.winner]}</div>
    <div class="row" style="justify-content:center"><button class="btn" data-act="undo">↶ Undo last rally</button><button class="btn pri" data-act="saveResult">Save result</button></div></div>`:''}`;}
ACT.followServer=()=>{followServer=!followServer;try{localStorage.setItem('pb_follow',followServer?'1':'0');}catch(e){}drawScorer();toast(followServer?'Serving team always shown at the bottom / right':'Showing the real court ends');};
(()=>{const mq=matchMedia('(orientation: portrait)'),f=()=>{if(SC)drawScorer();};mq.addEventListener?mq.addEventListener('change',f):mq.addListener(f);window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(f,150);});})();
ACT.rally=d=>rally(+d.t);
ACT.undo=()=>{const L=getGame(SC.ctx).live;if(!L.hist.length)return;const h=L.hist,prev=JSON.parse(h.pop());Object.keys(L).forEach(k=>delete L[k]);Object.assign(L,prev,{hist:h});save();drawScorer();};
ACT.firstServe=d=>{const L=getGame(SC.ctx).live,t=+d.t;L.serving=t;L.server=L.pos[t][0];L.serverNum=L.pos[t].length>1?2:0;save();drawScorer();};
ACT.swapPos=d=>{const L=getGame(SC.ctx).live,t=+d.t;L.pos[t].reverse();if(L.serving===t)L.server=L.pos[t][0];save();drawScorer();};
ACT.swapEnds=()=>{const L=getGame(SC.ctx).live;L.flipped=!L.flipped;L.midPrompt=false;save();drawScorer();};
ACT.dismissMid=()=>{getGame(SC.ctx).live.midPrompt=false;save();drawScorer();};
ACT.scClose=()=>closeScorer();
ACT.timeout=d=>{const g=getGame(SC.ctx),L=g.live,t=+d.t;if(L.to[t]>=maxTO(g.gameTo))return;snap(L);L.to[t]++;save();drawScorer();startTimer(60,`Timeout — ${teamLabel(g.sides[t])}`);};
ACT.scMenu=()=>{const g=getGame(SC.ctx),L=g.live,dbl=L.pos[0].length>1;
  openModal(`<h2>Game options</h2>
  <h3>Adjust score / server</h3>
  <div class="grid2">${[0,1].map(t=>`<label>${esc(teamLabel(g.sides[t]))}<input type="number" min="0" id="adj${t}" value="${L.score[t]}"></label>`).join('')}
  <label>Serving side<select id="adjS">${[0,1].map(t=>`<option value="${t}" ${L.serving===t?'selected':''}>${esc(teamLabel(g.sides[t]))}</option>`).join('')}</select></label>
  ${dbl?`<label>Server number<select id="adjN">${[1,2].map(n=>`<option ${L.serverNum===n?'selected':''}>${n}</option>`).join('')}</select></label>`:''}</div>
  ${dbl?`<label>Who is serving<select id="adjP">${g.sides.flat().map(id=>`<option value="${esc(id)}" ${L.server===id?'selected':''}>${esc(pname(id))}</option>`).join('')}</select></label>`:''}
  <div class="row end"><button class="btn pri" data-act="adjApply">Apply</button></div>
  <h3>Medical timeout (up to 15 min)</h3>
  <div class="row">${[0,1].map(t=>`<button class="btn" data-act="medTO" data-t="${t}">${esc(teamLabel(g.sides[t]))}${L.med[t]?' (used)':''}</button>`).join('')}</div>
  <h3>Other</h3>
  <div class="row"><button class="btn" data-act="betweenGames">2-min break timer</button><button class="btn danger" data-act="resetGame">Reset game to 0–0</button></div>
  <p class="muted small">Timeouts: ${maxTO(g.gameTo)} per team per game (1 minute each). Switch ends at ${midOf(g.gameTo)}.</p>
  <div class="row end"><button class="btn" data-act="closeModal">Close</button></div>`);};
ACT.adjApply=()=>{const g=getGame(SC.ctx),L=g.live;snap(L);L.score=[Math.max(0,+$('#adj0').value||0),Math.max(0,+$('#adj1').value||0)];L.serving=+$('#adjS').value;
  if($('#adjN')){L.serverNum=+$('#adjN').value;let sp=$('#adjP').value;if(!L.pos[L.serving].includes(sp))sp=L.pos[L.serving][0];L.server=sp;}else L.server=L.pos[L.serving][0];
  L.winner=null;const[a,b]=L.score;[0,1].forEach(t=>{const o=1-t;if(L.score[t]>=g.gameTo&&L.score[t]-L.score[o]>=(g.winBy||2))L.winner=t;});
  if(Math.max(a,b)>=midOf(g.gameTo))L.midDone=true;save();closeModal();drawScorer();};
ACT.medTO=d=>{const g=getGame(SC.ctx),L=g.live,t=+d.t;L.med[t]=1;save();closeModal();startTimer(900,`Medical timeout — ${teamLabel(g.sides[t])}`);};
ACT.betweenGames=()=>{closeModal();startTimer(120,'Break between games');};
ACT.resetGame=()=>{if(!confirm('Reset this game to 0–0?'))return;const g=getGame(SC.ctx);g.live=newLive(g);g.status='pending';g.score=[0,0];save();closeModal();drawScorer();};
ACT.saveResult=()=>{const g=getGame(SC.ctx);g.score=g.live.score.slice();g.status='done';
  if(SC.ctx.quick){S.quickHist.unshift({date:new Date().toISOString(),sides:g.sides,score:g.score,gameTo:g.gameTo});S.quickHist=S.quickHist.slice(0,30);S.quick=null;}
  save();closeScorer();toast('Result saved');};
/* Timer */
let TMR=null;
function startTimer(sec,label){stopTimer();const end=Date.now()+sec*1000,el=$('#timer');el.classList.remove('hidden');
  el.innerHTML=`<div class="tbox"><div style="font-size:18px">${esc(label)}</div><div class="tnum" id="tnum"></div><button class="btn pri" data-act="stopTimer">Resume play</button></div>`;
  let fired=false;const tick=()=>{const r=Math.max(0,Math.ceil((end-Date.now())/1000));const n=$('#tnum');if(!n)return;n.textContent=`${Math.floor(r/60)}:${pad(r%60)}`;
    if(r<=0&&!fired){fired=true;n.textContent='TIME';el.firstChild.classList.add('over');beep();clearInterval(TMR);}};tick();TMR=setInterval(tick,250);}
function stopTimer(){clearInterval(TMR);TMR=null;const el=$('#timer');el.classList.add('hidden');el.innerHTML='';}
ACT.stopTimer=stopTimer;
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.4,.8].forEach(t=>{const o=a.createOscillator(),gn=a.createGain();o.frequency.value=880;o.connect(gn);gn.connect(a.destination);
  gn.gain.setValueAtTime(.3,a.currentTime+t);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.32);});}catch(e){}
  if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);}

/* ================= Calendar ================= */
let calYM=null,calSel=null;
function dayItems(iso){const out=[];
  S.events.filter(e=>e.date===iso).forEach(e=>out.push({kind:'ev',id:e.id,start:e.startTime,end:eventEnd(e),title:e.name,sub:`${FMT[e.format]} · ${e.courts} court(s) · ${e.games.length} games`}));
  S.bookings.filter(b=>b.date===iso).forEach(b=>out.push({kind:'bk',id:b.id,start:b.start,end:addMin(b.start,+b.duration||60),title:b.title,court:b.court,sub:[b.court&&'Court '+b.court,`${b.duration} min`,b.organiser&&'Organiser: '+b.organiser].filter(Boolean).join(' · ')}));
  return out.sort((a,b)=>a.start.localeCompare(b.start));}
function viewCalendar(){if(!calSel)calSel=todayISO();if(!calYM)calYM=calSel.slice(0,7);
  const[y,m]=calYM.split('-').map(Number),first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,days=new Date(y,m,0).getDate(),today=todayISO();
  let cells=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dh">${d}</div>`).join('')+'<div></div>'.repeat(lead);
  for(let d=1;d<=days;d++){const iso=`${calYM}-${pad(d)}`,ev=S.events.filter(e=>e.date===iso).length,bk=S.bookings.filter(b=>b.date===iso).length;
    cells+=`<button class="${iso===today?'today':''} ${iso===calSel?'sel':''}" data-act="calPick" data-d="${iso}">${d}<span class="dots">${'<i class="ev"></i>'.repeat(Math.min(ev,3))}${'<i></i>'.repeat(Math.min(bk,3))}</span></button>`;}
  const items=dayItems(calSel);
  return `<div class="bar"><button class="btn" data-act="calNav" data-v="-1">‹</button><h2 style="margin:0;flex:1;text-align:center">${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="btn" data-act="calNav" data-v="1">›</button></div>
  <div class="row"><button class="btn sm" data-act="calToday">Today</button><span class="muted small"><span style="color:var(--a)">●</span> Events with games &nbsp; <span style="color:var(--b)">●</span> Court bookings</span></div>
  <div class="cal">${cells}</div>
  <div class="bar" style="margin-top:18px"><h3 style="margin:0">${fmtDate(calSel)}</h3><span class="grow"></span><button class="btn sm" data-act="bookingEdit" data-date="${calSel}">+ Booking</button><button class="btn pri sm" data-act="eventNew" data-date="${calSel}">+ Event</button></div>
  ${items.map(i=>`<div class="item ${i.kind==='ev'?'ev':''}" data-act="${i.kind==='ev'?'calEvent':'bookingEdit'}" data-id="${i.id}"><span class="t">${i.start}–${i.end}</span><div><b>${esc(i.title)}</b><div class="muted small">${esc(i.sub)}</div></div></div>`).join('')
   ||'<div class="empty">Nothing scheduled. Add a court booking or a new event.</div>'}`;}
ACT.calPick=d=>{calSel=d.d;render();};
ACT.calNav=d=>{const[y,m]=calYM.split('-').map(Number),x=new Date(y,m-1+(+d.v),1);calYM=`${x.getFullYear()}-${pad(x.getMonth()+1)}`;render();};
ACT.calToday=()=>{calSel=todayISO();calYM=calSel.slice(0,7);render();};
ACT.calEvent=d=>{tab='events';openEventId=d.id;evTab='schedule';render();window.scrollTo(0,0);};
ACT.bookingEdit=d=>{const b=d.id?S.bookings.find(x=>x.id===d.id):{title:'',date:d.date||calSel||todayISO(),start:'08:00',duration:60,court:'',organiser:'',notes:''};
  openModal(`<h2>${d.id?'Edit booking':'New court booking'}</h2>
  <label>Title<input id="b_title" value="${esc(b.title)}" placeholder="e.g. Open play / Coaching / League night"></label>
  <div class="grid2"><label>Date<input type="date" id="b_date" value="${b.date}"></label><label>Start time<input type="time" id="b_start" value="${b.start}"></label>
  <label>Duration<select id="b_dur">${[30,45,60,90,120,150,180,240].map(n=>`<option value="${n}" ${n==b.duration?'selected':''}>${n<60?n+' min':(n/60)+' hr'}</option>`).join('')}</select></label>
  <label>Court(s)<input id="b_court" value="${esc(b.court)}" placeholder="e.g. 1 or 1-3"></label></div>
  <label>Organiser<input id="b_org" value="${esc(b.organiser)}"></label>
  <label>Notes<textarea id="b_notes">${esc(b.notes)}</textarea></label>
  <div class="row end">${d.id?`<button class="btn danger" data-act="bookingDelete" data-id="${d.id}">Delete</button>`:''}<span class="grow"></span><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="bookingSave" data-id="${d.id||''}">Save</button></div>`);};
ACT.bookingSave=d=>{const b={title:$('#b_title').value.trim()||'Court booking',date:$('#b_date').value,start:$('#b_start').value||'08:00',duration:+$('#b_dur').value,court:$('#b_court').value.trim(),organiser:$('#b_org').value.trim(),notes:$('#b_notes').value.trim()};
  if(!b.date)return toast('Pick a date');const s=toMin(b.start),e=s+b.duration;
  const clash=dayItems(b.date).filter(i=>i.id!==d.id&&toMin(i.start)<e&&toMin(i.end)>s&&(i.kind==='ev'||!b.court||!i.court||i.court===b.court));
  if(clash.length&&!confirm(`This overlaps with:\n${clash.map(c=>`• ${c.title} (${c.start}–${c.end})`).join('\n')}\n\nSave anyway?`))return;
  if(d.id)Object.assign(S.bookings.find(x=>x.id===d.id),b);else S.bookings.push({id:uid(),...b});
  calSel=b.date;calYM=b.date.slice(0,7);save();closeModal();render();toast('Booking saved');};
ACT.bookingDelete=d=>{if(!confirm('Delete this booking?'))return;S.bookings=S.bookings.filter(x=>x.id!==d.id);save();closeModal();render();};

/* ================= Settings / backup ================= */
function viewSettings(){return `<h2>More</h2>
  ${cloudCard()}
  <div class="card"><b>Backup file</b>
   <p class="muted small">Data is always kept on this device as well. Export a backup any time for safe keeping, or to copy data to a device without cloud sync.</p>
   <div class="row"><button class="btn pri" data-act="exportData">⬇ Export backup</button><label class="btn" style="margin:0;color:var(--ink)">⬆ Import backup<input type="file" accept="application/json,.json" id="importFile" hidden></label></div></div>
  <div class="card"><b>Pickleball rules used by the scorer</b><ul class="rules small">
   <li><b>Side-out scoring:</b> only the serving side can score. The score is called as <i>server score – receiver score – server number</i>, e.g. 4-2-1.</li>
   <li><b>Start of game:</b> doubles begins at 0-0-2, so the first serving side has only one server.</li>
   <li><b>Serving side wins the rally:</b> they score a point and the server swaps sides with their partner.</li>
   <li><b>Serving side loses the rally:</b> server 1 passes to server 2; after server 2 it's a side out. After a side out, the player in the right-hand court serves first.</li>
   <li><b>Position:</b> after every side out the first serve is from the right-hand court, and the server switches courts each time their side scores. In doubles the team's starting server is in the right court whenever the team score is even. In singles you serve from the right when your score is even, the left when odd.</li>
   <li><b>Switch ends</b> when the first side reaches 6 (game to 11), 8 (to 15) or 11 (to 21). The app reminds you and has a Swap sides button any time.</li>
   <li><b>Timeouts:</b> 2 per side per game in games to 11 or 15, 3 in games to 21; 1 minute each. Medical timeout up to 15 minutes. Games are won by 2.</li></ul>
   <p class="muted small">Based on USA Pickleball rules — check your local tournament rules.</p></div>
  <div class="card"><b>Danger zone</b><div class="row"><button class="btn danger" data-act="wipe">Delete all data on this device</button></div></div>
  <p class="muted small">Storage used: ${(JSON.stringify(S).length/1024).toFixed(0)} KB</p>`;}
ACT.exportData=()=>{const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`pickleball-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);};
function importData(file){const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.players))throw 0;if(!confirm('Replace all data on this device with this backup?'))return;S=Object.assign(blank(),d);save();render();toast('Backup restored');}catch(e){toast('That file is not a valid backup');}};fr.readAsText(file);}
ACT.wipe=()=>{if(confirm(CLOUD?'Delete ALL players, events and bookings for EVERY device in this club? This cannot be undone.':'Delete ALL players, events and bookings on this device? This cannot be undone.')&&confirm('Are you absolutely sure?')){S=blank();save();render();}};

/* ================= Global input handlers ================= */
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='psearch'){const q=t.value.toLowerCase();document.querySelectorAll('.pcard').forEach(c=>c.style.display=c.dataset.name.includes(q)?'':'none');return;}
  if(t.dataset.draft&&draft){const f=t.dataset.draft;if(t.type==='radio'&&!t.checked)return;let v=t.type==='checkbox'?t.checked:t.value;if(t.type==='number')v=+v;draft[f]=v;
    if(f==='format'){if(v==='rotating')draft.mode='count';if(v==='fixed'||v==='mixed')autoPair();renderDraft();}
    else if(f==='mode'||f==='genderRule')renderDraft();
    else if(f==='perPlayer'){const h=$('#dhint');if(h)h.innerHTML=scheduleHint();}}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='phfile'&&t.files[0])resizeImage(t.files[0]).then(u=>{editPhoto=u;$('#phprev').innerHTML=photoPrev();}).catch(()=>toast('Could not read that image'));
  if(t.id==='importFile'&&t.files[0]){importData(t.files[0]);t.value='';}
  if(t.dataset.q!==undefined){if(t.dataset.q==='to')Q.gameTo=+t.value;else Q.ids[+t.dataset.q]=t.value;}});

/* ================= Cloud sync (free Firebase Realtime Database) ================= */
const FB_VER='10.12.2',CLOUD_KEY='pb_cloud',SYNC_KEY='pb_synced';
let CLOUD=(()=>{try{return JSON.parse(localStorage.getItem(CLOUD_KEY));}catch(e){return null;}})();
let synced={};try{const x=JSON.parse(localStorage.getItem(SYNC_KEY));if(x&&CLOUD&&x.club===CLOUD.club)synced=x.h||{};}catch(e){}
const cloud={status:'off',msg:'',F:null,app:null,db:null,unsubs:[],timer:null,ready:false};
let pendingJoin=null;
const RULES=`{
  "rules": {
    "clubs": {
      "$club": {
        ".read": "auth != null && $club.length >= 12",
        ".write": "auth != null && $club.length >= 12"
      }
    }
  }
}`;
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function persistSynced(){try{localStorage.setItem(SYNC_KEY,JSON.stringify({club:CLOUD&&CLOUD.club,h:synced}));}catch(e){}}
// Each player / booking / event / game is stored as its own small record, so a rally only uploads one game.
function flatten(st){const m={};
  st.players.forEach(p=>m['players/'+p.id]=JSON.stringify(p));
  st.bookings.forEach(b=>m['bookings/'+b.id]=JSON.stringify(b));
  st.events.forEach(e=>{const{games,...meta}=e;m[`events/${e.id}/meta`]=JSON.stringify(meta);(games||[]).forEach(g=>m[`events/${e.id}/games/${g.id}`]=JSON.stringify(g));});
  if(st.quick)m['quick/current']=JSON.stringify(st.quick);
  if(st.quickHist&&st.quickHist.length)m['quick/history']=JSON.stringify(st.quickHist);
  return m;}
function unflatten(m){const st=blank(),ev={};
  for(const[k,v]of Object.entries(m)){const p=k.split('/');let o;try{o=JSON.parse(v);}catch(e){continue;}
    if(p[0]==='players')st.players.push(o);else if(p[0]==='bookings')st.bookings.push(o);
    else if(p[0]==='events'){const e=ev[p[1]]||(ev[p[1]]={games:[]});if(p[2]==='meta')Object.assign(e,o);else e.games.push(o);}
    else if(k==='quick/current')st.quick=o;else if(k==='quick/history')st.quickHist=o;}
  st.events=Object.values(ev).filter(e=>e.id).map(e=>{e.games.sort((a,b)=>a.round-b.round||a.court-b.court);return e;});
  return st;}
function snapToMap(v,pre='',m={}){if(v==null)return m;if(typeof v==='string'){m[pre]=v;return m;}if(typeof v==='object')for(const k in v)snapToMap(v[k],pre?pre+'/'+k:k,m);return m;}
// 3-way merge: keep anything changed on this device since the last sync, take everything else from the club.
function onRemote(remote){const local=flatten(S),out={},push={};let changed=false;
  new Set([...Object.keys(remote),...Object.keys(local),...Object.keys(synced)]).forEach(k=>{const l=local[k],r=remote[k];
    const localChanged=(l===undefined?undefined:hash(l))!==synced[k];
    if(localChanged){if(l!==undefined)out[k]=l;if(l!==r)push[k]=l===undefined?null:l;}
    else{if(r!==undefined)out[k]=r;if(out[k]!==l)changed=true;}});
  synced={};Object.keys(out).forEach(k=>synced[k]=hash(out[k]));persistSynced();
  if(changed){S=unflatten(out);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(tab!=='settings')render();if(SC)drawScorer();}
  cloud.ready=true;if(Object.keys(push).length)cloudWrite(push);}
function cloudQueue(){if(!CLOUD||!cloud.ready)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(pushLocal,250);}
function pushLocal(){const local=flatten(S),push={};
  Object.keys(local).forEach(k=>{const h=hash(local[k]);if(synced[k]!==h){push[k]=local[k];synced[k]=h;}});
  Object.keys(synced).forEach(k=>{if(!(k in local)){push[k]=null;delete synced[k];}});
  persistSynced();if(Object.keys(push).length)cloudWrite(push);}
function cloudWrite(push){if(!cloud.db)return;cloud.F.update(cloud.F.ref(cloud.db,'clubs/'+CLOUD.club),push).catch(e=>setCloud('error',friendly(e)));}
function friendly(e){const t=String((e&&(e.code||e.message))||e);
  if(/operation-not-allowed|admin-restricted/i.test(t))return 'Anonymous sign-in is off. In Firebase: Authentication → Sign-in method → enable Anonymous.';
  if(/permission/i.test(t))return 'The database rules are blocking access. Paste the rules from the setup steps into Realtime Database → Rules and Publish.';
  if(/api-key|invalid-api-key/i.test(t))return 'The API key in the Firebase config is not valid — paste the config again.';
  if(/fetch|import|network|load/i.test(t))return 'Could not reach Firebase — check the internet connection, then tap Reconnect.';
  return t;}
function statusText(){return{off:'Not connected',connecting:'Connecting…',online:'✓ Synced',offline:'Offline — changes are saved on this device and will upload when back online',error:'⚠ '+cloud.msg}[cloud.status];}
function setCloud(st,msg=''){cloud.status=st;cloud.msg=msg;const p=$('#cloudPill');
  p.classList.toggle('hidden',st==='off');p.classList.toggle('err',st==='error');
  p.textContent={connecting:'☁ Connecting…',online:'☁ Synced',offline:'☁ Offline',error:'⚠ Sync error'}[st]||'';
  const el=$('#cloudStatus');if(el)el.textContent=statusText();}
async function cloudConnect(){if(!CLOUD)return;cloudStop();setCloud('connecting');
  try{if(!cloud.F){const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;const[a,b,c]=await Promise.all(['firebase-app.js','firebase-auth.js','firebase-database.js'].map(f=>import(base+f)));cloud.F={...a,...b,...c};}
    const F=cloud.F;cloud.app=F.initializeApp(CLOUD.config,'pb'+Date.now());
    await F.signInAnonymously(F.getAuth(cloud.app));
    cloud.db=F.getDatabase(cloud.app,CLOUD.config.databaseURL);
    cloud.unsubs.push(F.onValue(F.ref(cloud.db,'.info/connected'),s=>{if(cloud.ready&&cloud.status!=='error')setCloud(s.val()?'online':'offline');}));
    cloud.unsubs.push(F.onValue(F.ref(cloud.db,'clubs/'+CLOUD.club),snap=>{onRemote(snapToMap(snap.val()));if(cloud.status!=='offline')setCloud('online');},e=>setCloud('error',friendly(e))));
  }catch(e){setCloud('error',friendly(e));}}
function cloudStop(){cloud.unsubs.forEach(u=>{try{u();}catch(e){}});cloud.unsubs=[];cloud.ready=false;clearTimeout(cloud.timer);
  if(cloud.app&&cloud.F)cloud.F.deleteApp(cloud.app).catch(()=>{});cloud.app=null;cloud.db=null;}
function parseConfig(txt){txt=(txt||'').trim();try{const j=JSON.parse(txt);if(j&&j.apiKey)return j;}catch(e){}
  const o={};['apiKey','authDomain','databaseURL','projectId','storageBucket','messagingSenderId','appId'].forEach(k=>{const m=txt.match(new RegExp(`${k}\\s*[:=]\\s*["']([^"']+)["']`));if(m)o[k]=m[1];});
  return o.apiKey&&o.projectId?o:null;}
const suggestClub=()=>'club-'+Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
function joinCloud(c,replace){cloudStop();CLOUD=c;try{localStorage.setItem(CLOUD_KEY,JSON.stringify(c));}catch(e){}synced={};
  if(replace){S=blank();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}persistSynced();render();cloudConnect();}
function cloudCard(){
  if(CLOUD)return `<div class="card"><b>☁ Cloud sync</b> · <span id="cloudStatus" class="small">${esc(statusText())}</span>
   <p class="muted small">Club code <b>${esc(CLOUD.club)}</b> · Firebase project ${esc(CLOUD.config.projectId||'')}</p>
   <p class="small">Every device connected to this club shares players, photos, events, bookings and live scores in real time.</p>
   <div class="row"><button class="btn pri" data-act="cloudInvite">🔗 Share invite link</button><button class="btn" data-act="cloudReconnect">↻ Reconnect</button><button class="btn danger" data-act="cloudOff">Disconnect this device</button></div>
   <p class="muted small">Open the invite link on another tablet or phone to join in one tap. Anyone with the link can view and edit this club's data, so share it only with your organisers.</p></div>`;
  return `<div class="card"><b>☁ Cloud sync — share data across all devices (free)</b>
   <p class="muted small">Uses a free Google Firebase database (no credit card). Set it up once on one device, then send the invite link to the others.</p>
   <details><summary>Setup steps (about 10 minutes)</summary><ol class="small">
    <li>Go to <b>console.firebase.google.com</b>, sign in with Google and click <b>Create a project</b>. Google Analytics can be turned off.</li>
    <li><b>Build → Authentication → Get started → Sign-in method</b>, choose <b>Anonymous</b> and enable it.</li>
    <li><b>Build → Realtime Database → Create database</b>, pick location <b>Singapore (asia-southeast1)</b>, start in <b>locked mode</b>.</li>
    <li>Open the database's <b>Rules</b> tab, replace everything with the rules below, then <b>Publish</b>.</li>
    <li>Click ⚙ <b>Project settings → General → Your apps → Web (&lt;/&gt;)</b>, register an app (no hosting needed) and copy the <code>firebaseConfig</code> block into the box below.</li>
    <li>Copy the database URL shown at the top of the Realtime Database page if it isn't in the config.</li></ol>
    <pre class="code">${esc(RULES)}</pre><button class="btn sm" data-act="copyRules">Copy rules</button></details>
   <label>Firebase config<textarea id="c_cfg" placeholder="const firebaseConfig = { apiKey: &quot;…&quot;, … };"></textarea></label>
   <label>Realtime Database URL <small>(if not in the config)</small><input id="c_url" placeholder="https://your-project-default-rtdb.asia-southeast1.firebasedatabase.app"></label>
   <label>Club code<input id="c_club" value="${suggestClub()}" autocapitalize="off" autocomplete="off"></label>
   <p class="muted small">The club code works like a password for your club's data — keep it long and random.</p>
   <label class="chk"><input type="checkbox" id="c_replace"> Join an existing club and replace this device's data (don't upload what's here)</label>
   ${cloud.status==='error'?`<p class="hint">⚠ ${esc(cloud.msg)}</p>`:''}
   <div class="row end"><button class="btn pri" data-act="cloudOn">Connect</button></div></div>`;}
ACT.copyRules=async()=>{try{await navigator.clipboard.writeText(RULES);toast('Rules copied');}catch(e){prompt('Copy these rules:',RULES);}};
ACT.cloudOn=()=>{const cfg=parseConfig($('#c_cfg').value);if(!cfg)return toast('Could not read the Firebase config — paste the whole firebaseConfig block');
  const url=$('#c_url').value.trim();if(url)cfg.databaseURL=url;if(!cfg.databaseURL)return toast('Please add the Realtime Database URL');
  const club=$('#c_club').value.trim().toLowerCase();if(!/^[a-z0-9-]{12,60}$/.test(club))return toast('Club code needs 12+ letters, numbers or dashes');
  joinCloud({config:cfg,club},$('#c_replace').checked);toast('Connecting…');};
ACT.cloudReconnect=()=>cloudConnect();
ACT.cloudOff=()=>{if(!confirm('Disconnect this device from the club? Your data stays on this device; other devices are not affected.'))return;
  cloudStop();CLOUD=null;synced={};try{localStorage.removeItem(CLOUD_KEY);localStorage.removeItem(SYNC_KEY);}catch(e){}setCloud('off');render();};
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
ACT.cloudInvite=async()=>{const url=location.href.split('#')[0]+'#join='+b64e(JSON.stringify(CLOUD));
  if(navigator.share){try{await navigator.share({title:'Join our Pickleball Club',url});return;}catch(e){if(e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(url);toast('Invite link copied');}catch(e){prompt('Copy this invite link:',url);}};
function checkJoin(){const m=location.hash.match(/^#join=(.+)$/);if(!m)return;history.replaceState(null,'',location.pathname+location.search);
  let c;try{c=JSON.parse(b64d(m[1]));}catch(e){return toast('That invite link is damaged');}
  if(!c||!c.config||!c.club)return;if(CLOUD&&CLOUD.club===c.club)return toast('Already connected to this club');
  pendingJoin=c;const has=S.players.length||S.events.length||S.bookings.length;
  openModal(`<h2>Join club?</h2><p>This device will share players, events, bookings and live scores with club <b>${esc(c.club)}</b>.</p>
   ${has?`<label class="chk"><input type="checkbox" id="j_replace" checked> Replace the data currently on this device with the club's</label>`:''}
   <div class="row end"><button class="btn" data-act="closeModal">Cancel</button><button class="btn pri" data-act="joinGo">Join club</button></div>`);}
ACT.joinGo=()=>{const r=$('#j_replace');closeModal();joinCloud(pendingJoin,r?r.checked:true);tab='events';render();toast('Joining club…');};
window.addEventListener('hashchange',checkJoin);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SC)wake(true);});
render();checkJoin();if(CLOUD)cloudConnect();
</script>
